name: nifty-alert

on:
  workflow_dispatch:
    inputs:
      session:
        description: "test / morning / afternoon"
        default: "test"

jobs:
  test:
    if: github.event.inputs.session == 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python nifty_alert.py
        env:
          TEST: "1"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

  morning:
    if: github.event.inputs.session == 'morning'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python nifty_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HC_URL: ${{ secrets.HC_URL }}
          WINDOW_START: "09:15"
          WINDOW_END: "12:30"
          RUN_UNTIL: "12:35"
      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="⚠️ Morning job fail ho gaya. GitHub Actions tab check karo, chart khud dekho."

  afternoon:
    if: github.event.inputs.session == 'afternoon'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python nifty_alert.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HC_URL: ${{ secrets.HC_URL }}
          WINDOW_START: "12:30"
          WINDOW_END: "15:30"
          RUN_UNTIL: "15:33"
      - name: Notify on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="⚠️ Afternoon job fail ho gaya. GitHub Actions tab check karo, chart khud dekho."
